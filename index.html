<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Baby Girl ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffd3a5);
      color: white;
      text-align: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.12);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      font-size: 22px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .cake {
      font-size: 70px;
      margin-bottom: 20px;
      animation: bounce 1.6s infinite;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #ff4f81;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    .heart {
      position: absolute;
      bottom: -30px;
      font-size: 22px;
      animation: floatUp 5s linear forwards;
      opacity: 0.9;
      z-index: 1;
    }

    .footer-text {
      margin-top: 18px;
      font-size: 15px;
      opacity: 0.95;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="cake">🎂</div>
    <h1>Happy Birthday Baby Girl ❤️</h1>
    <p>Ajj jashan manae jaan gay tera soniye birthday aa.. Paise bej party krni h muje 😌🎀</p>

    <button onclick="msg()">Click for Surprise</button>

    <div class="footer-text">Made with love just for you ✨</div>
  </div>

  <script>
    function msg() {
      alert(`Happy birthday baby girl 🎀❤️

Love you a lot, miss you a lot and waiting to see you soon 💋

I know tuje yehi lg rha ha, arre yeh tho bhul gya bday but sher kabhi kuch bhulta nhiii beta 😎

So today is your day and the most important thing, it’s your 6th birthday with me. Means from 6 years we are together, it’s not a small thing bro, literally 6 years. Lots of appreciation to both of us ❤️

Haan gift tera pending ha, wo tuje yaha aane pe milega. Tb tk k liye wait kro 🎁

Love you a lot, enjoy your day 💋❤️
Hum jb milenge phir ache se apka bday celebrate karenge 🎀♥️

Stay happy, stay blessed. I’m always with you 🩵

Mubarak ho, tu budhi ho gyi Aunty jii 😣😂

Love you baabbbbyyyyyyy 🎀❤️`);
    }

    function hearts() {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (18 + Math.random() * 20) + "px";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(hearts, 250);
  </script>

</body>
</html>
