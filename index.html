<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday You chamgadad❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffd3a5);
      color: white;
      text-align: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.12);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      font-size: 22px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .cake {
      font-size: 70px;
      margin-bottom: 20px;
      animation: bounce 1.6s infinite;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #ff4f81;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    .heart {
      position: absolute;
      bottom: -30px;
      font-size: 22px;
      animation: floatUp 5s linear forwards;
      opacity: 0.9;
      z-index: 1;
    }

    .footer-text {
      margin-top: 18px;
      font-size: 15px;
      opacity: 0.95;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="cake">🎂</div>
    <h1>Happy Birthday Chamgadad ladki</h1>
    <p>Ajj jashan manae jaan gay tera soniye birthday aa.. Paise bej party krni h muje 😌🎀</p>

    <button onclick="msg()">Click for Surprise</button>

    <div class="footer-text">Made with so much anger just for you ✨</div>
  </div>

  <script>
    function msg() {
      alert(`Happy birthday girl 🎀❤️

Raab tuje lambi umer de, kamyabi de, dheer sara paisa de aur tu wo paisa muje de. Well happiest bday once again stay blessed and enjoy your day❤️`);
    }

    function hearts() {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (18 + Math.random() * 20) + "px";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(hearts, 250);
  </script>

</body>
</html>
